<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techno Audio Reactive Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        button {
            background: #00ff00;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00cc00;
            transform: scale(1.05);
        }
        input[type="file"] {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>🎛️ TECHNO VISUALIZER</h3>
        <input type="file" id="audioFile" accept="audio/*">
        <br>
        <button id="playBtn">▶ PLAY</button>
        <button id="pauseBtn">⏸ PAUSE</button>
        <br>
        <label>Mode: </label>
        <button id="mode1">Circular</button>
        <button id="mode2">Waveform</button>
        <button id="mode3">Particles</button>
    </div>
    <script src="sketch.js"></script>
</body>
</html>
